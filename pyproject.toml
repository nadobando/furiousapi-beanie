[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "furiousapi-beanie"
version = "0.0.1-dev.1"
description = "MongoDB Implementation for FastAPI & FuriousAPI"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [
    { name = "nadobando", email = "7695172+nadobando@users.noreply.github.com" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Framework :: Pydantic",
    "Framework :: FastAPI",
    "Topic :: Database",
    "Topic :: Software Development",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Typing :: Typed"
]
dependencies = [
    "beanie>=1.0,<2",
    "fastapi>=0.110,<0.116",
    "flatten-dict>=0.4.2,<0.5",
    "furiousapi-core",
    "pydantic>=1.10.13,<3.0.0",
    "pydantic-settings",
]

[project.urls]
Homepage = "https://github.com/nadobando/furiousapi-beanie"
Repository = "https://github.com/nadobando/furiousapi-beanie.git"
Documentation = "https://nad,obando.github.io/furiousapi"

#[project.scripts]
#furious = "furiousapi.cli:app"

[dependency-groups]
dev = [
    # test runner
    "pytest>=7.4.2,<8",
    "pytest-asyncio>=0.23,<0.25",
    "pytest-cov>=4.0.0,<5",
    "pytest-xdist[psutil]>=3.2.1,<4",
    "coverage>=7.1.0,<8",
    "httpx>=0.27,<1",
    # tooling
    "mypy>=1.6,<2",
    "pre-commit>=4,<5",
    # backend-specific
    "mongomock-motor>=0.0",
    "testcontainers[mongodb]>=4.0",
]

[tool.uv.sources]
furiousapi-core = { git = "https://github.com/nadobando/furiousapi-core.git", branch = "dev" }

[tool.hatch.build.targets.wheel]
packages = ["furiousapi"]

[tool.autopep8]
aggressive = 3
in-place = true
max_line_length = 120
recursive = true

[tool.bandit.assert_used]
skips = ['**/test_*.py', '**/test_*.py']

[tool.black]
exclude = """
(
  /(
      .eggs
    | .git
    | .hg
    | .mypy_cache
    | .tox
    | .venv
    | venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
"""
include = '\.pyi?$'
line-length = 120
preview = true
target-version = ['py39']

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:"
]

[tool.coverage.run]
branch = true
include = [
    "*/furiousapi/*",
    "*/examples/*"
]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disable_error_code = "no-redef"
exclude = [
    '\.venv'
]
explicit_package_bases = true
ignore_missing_imports = true
# strict = true
plugins = "pydantic.mypy"
warn_unused_ignores = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = [
    "tests"
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv"
]
line-length = 120
target-version = "py310"
lint.ignore = [
    "SIM108",
    "ANN204",
    "D",
    "A003",
    "B008",
    "B905",
    "COM",
    "PLR0913",
    "ANN003",
    "ANN002",
    "EM101",
    "TRY003",
    "G004",
    "EM102",
    "I001",
    "ANN401",
    "TD",
    "FIX002",
    "TC003",
    "PLC0415",
    "RUF059",
    "LOG014",
    "RUF100",
]
lint.select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"furiousapi/beanie/models.py" = ["N804", "ERA001"]
"furiousapi/beanie/utils.py" = ["C901", "ERA001", "FURB188", "PERF401"]
"tests/*" = ["ANN201", "S101", "DTZ001", "PLR0913"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version"
]
version_variables = [
    "furiousapi/beanie/__init__.py:__version__"
]

[tool.semantic_release.branches.dev]
match = "dev"
prerelease = true
prerelease_token = "dev"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "^ci:.*",
    "^(?!feat:|fix:|perf:|refactor:).*$"
]

[tool.semantic_release.publish]
upload_to_vcs_release = false
